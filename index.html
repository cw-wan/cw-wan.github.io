<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Construction</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050608; overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* 噪点层 */
        #noise-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; pointer-events: none; opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        #world-canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }

        .center-content {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; width: 100%;
            mix-blend-mode: hard-light;
        }

        h1 {
            font-weight: 300; font-size: 1.4rem; color: #e0e5ff;
            text-transform: uppercase; margin: 0 0 1.5rem 0; opacity: 0.95;
            letter-spacing: 0.8em; text-indent: 0.8em;
            text-shadow: 0 0 20px rgba(200, 220, 255, 0.4);
        }

        .subtitle-cn {
            font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif;
            font-weight: 400; font-size: 1rem; color: rgba(224, 229, 255, 0.7);
            letter-spacing: 1.2em; text-indent: 1.2em;
        }

        .line { position: absolute; background: rgba(220, 230, 255, 0.1); }
        .l-vert { width: 1px; height: 100px; left: 50%; bottom: 0; transform: translateX(-50%); }
        .l-hori { width: 100px; height: 1px; top: 50%; left: 30px; }
    </style>
</head>
<body>
    <div id="noise-layer"></div>
    <canvas id="world-canvas"></canvas>
    
    <div class="ui-layer">
        <div class="line l-vert"></div>
        <div class="line l-hori"></div>
        <div class="center-content">
            <h1>NEON GENESIS</h1>
            <div class="subtitle-cn">重建秩序 · 晨蔚的世界</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        const CONFIG = {
            gridSize: 18,       // 高密度
            viewDistance: 160,  // 高视距
            speed: 0.8,
            fov: 650,
            nearFadeLimit: 100, 
            farFadeLimit: 3000,
            sideFadeMargin: 200, // 【新配置】两侧边缘渐变区域宽度 (像素)
            cameraHeight: 200
        };

        let flightOffset = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // 数学沙丘模型
        function getDuneHeight(x, z) {
            let y = Math.sin(x * 0.001 + z * 0.0008) * 80;
            y += Math.sin(x * 0.0025 + z * 0.002 + 100) * 35;
            y += Math.sin(x * 0.005 + z * 0.01) * 5;
            return y * 1.2; 
        }

        function draw() {
            ctx.fillStyle = "#050608";
            ctx.fillRect(0, 0, width, height);

            flightOffset -= CONFIG.speed;
            let gridShift = flightOffset % CONFIG.gridSize;
            const horizonY = height * 0.55;

            // 氛围光
            const gradient = ctx.createLinearGradient(0, horizonY - 150, 0, horizonY + 120);
            gradient.addColorStop(0, "rgba(0,0,0,0)");
            gradient.addColorStop(0.5, "rgba(200, 220, 255, 0.03)"); 
            gradient.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, horizonY - 150, width, 270);

            // 增加列数以确保覆盖到屏幕外，供渐变使用
            const cols = Math.ceil(width / CONFIG.gridSize * 1.8) + 40; 
            const rows = CONFIG.viewDistance;
            const cx = width / 2;
            const cy = horizonY;

            for (let z = 0; z < rows; z++) {
                let localZ = z * CONFIG.gridSize + gridShift;
                if (localZ <= 0 || localZ > CONFIG.farFadeLimit) continue;

                const scale = CONFIG.fov / (CONFIG.fov + localZ);
                
                // --- 纵向透明度计算 (远近) ---
                let distRatio = localZ / CONFIG.farFadeLimit;
                let opacityFar = 1 - Math.pow(distRatio, 2); 
                let opacityNear = 1;
                if (localZ < CONFIG.nearFadeLimit) opacityNear = localZ / CONFIG.nearFadeLimit; 
                let opacityDepth = opacityFar * opacityNear; // 合并远近透明度

                for (let x = -cols/2; x < cols/2; x++) {
                    let worldX = x * CONFIG.gridSize;
                    let absoluteZ = z * CONFIG.gridSize + flightOffset;
                    
                    let duneHeight = getDuneHeight(worldX, absoluteZ);
                    let worldY = CONFIG.cameraHeight + duneHeight;

                    let screenX = cx + worldX * scale;
                    let screenY = cy + worldY * scale;

                    // --- 【核心修改】横向透明度计算 (两侧边缘) ---
                    // 计算粒子距离左右屏幕边缘的距离
                    let distToLeft = screenX;
                    let distToRight = width - screenX;
                    // 取最近边缘的距离
                    let closestEdgeDist = Math.min(distToLeft, distToRight);

                    let opacitySide = 1.0;
                    // 如果进入了边缘渐变区 (比如距离边缘小于 200px)
                    if (closestEdgeDist < CONFIG.sideFadeMargin) {
                        // 计算渐变比例 (距离越近越透明)
                        opacitySide = closestEdgeDist / CONFIG.sideFadeMargin;
                        // 确保不小于0
                        opacitySide = Math.max(0, opacitySide);
                    }

                    // --- 最终透明度合成 ---
                    // 深度透明度 * 横向透明度
                    let finalAlpha = opacityDepth * opacitySide;

                    // 性能优化：剔除几乎透明的粒子
                    if (finalAlpha < 0.01) continue;
                    
                    let size = Math.max(0.6, 2.5 * scale);
                    let brightness = 1 + (duneHeight / 150); 
                    
                    let r = 200 * brightness; let g = 215 * brightness; let b = 255 * brightness;
                    r = r > 255 ? 255 : (r < 0 ? 0 : r);
                    g = g > 255 ? 255 : (g < 0 ? 0 : g);
                    b = b > 255 ? 255 : (b < 0 ? 0 : b);

                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${finalAlpha})`;
                    ctx.fillRect(screenX, screenY, size, size);
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
