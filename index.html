<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECONSTRUCTION</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        #noise-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; pointer-events: none; opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        #world-canvas {
            display: block; position: absolute; top: 0; left: 0; z-index: 1;
        }

        .ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; pointer-events: none;
        }

        .center-content {
            position: absolute;
            top: 45%; 
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%; 
            mix-blend-mode: hard-light;
        }

        h1 {
            font-weight: 300;
            font-size: 1.2rem;
            color: #ffffff;
            text-transform: uppercase;
            margin: 0 0 1.5rem 0;
            opacity: 0.9;
            
            letter-spacing: 0.8em;
            text-indent: 0.8em; 
        }

        .subtitle-cn {
            font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif;
            font-weight: 400;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.65);
            
            letter-spacing: 1.2em;
            text-indent: 1.2em;
        }

        .line { position: absolute; background: rgba(255,255,255,0.1); }
        .l-vert { width: 1px; height: 80px; left: 50%; bottom: 0; transform: translateX(-50%); }
        .l-hori { width: 80px; height: 1px; top: 50%; left: 30px; }

    </style>
</head>
<body>

    <div id="noise-layer"></div>
    <canvas id="world-canvas"></canvas>

    <div class="ui-layer">
        <div class="line l-vert"></div>
        <div class="line l-hori"></div>
        
        <div class="center-content">
            <h1>Neon Genesis</h1>
            <div class="subtitle-cn">重塑秩序 · 晨蔚的世界</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const CONFIG = { gridSize: 50, speed: 1.2, waveHeight: 45, waveFreq: 0.003, viewDistance: 70, fov: 350 };
        let flightOffset = 0;
        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resize);
        resize();
        function draw() {
            ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, width, height);
            flightOffset -= CONFIG.speed;
            const horizonY = height * 0.55;
            const gradient = ctx.createLinearGradient(0, horizonY - 100, 0, horizonY + 80);
            gradient.addColorStop(0, "rgba(0,0,0,0)"); gradient.addColorStop(0.5, "rgba(200,210,255,0.03)"); gradient.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = gradient; ctx.fillRect(0, horizonY - 100, width, 180);
            const cols = Math.ceil(width / CONFIG.gridSize) + 20; const rows = CONFIG.viewDistance; const cx = width / 2; const cy = horizonY;
            for (let z = 0; z < rows; z++) {
                let localZ = z * CONFIG.gridSize + (flightOffset % CONFIG.gridSize);
                if (localZ <= 0 || localZ > 3000) continue;
                const scale = CONFIG.fov / (CONFIG.fov + localZ); const alpha = localZ / 3000;
                for (let x = -cols/2; x < cols/2; x++) {
                    let worldX = x * CONFIG.gridSize; let absoluteZ = z * CONFIG.gridSize + flightOffset;
                    let wave = Math.sin(worldX * 0.004 + absoluteZ * 0.002) * Math.cos(absoluteZ * CONFIG.waveFreq) * CONFIG.waveHeight;
                    let screenX = cx + worldX * scale; let screenY = cy + (120 + wave) * scale; let size = Math.max(0.6, 2.2 * scale);
                    ctx.fillStyle = `rgba(220, 230, 255, ${1 - alpha})`; ctx.fillRect(screenX, screenY, size, size);
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
